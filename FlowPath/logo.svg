<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FlowPath: a start node forks into two options; the path taken is solid, the other is dimmed. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1FB5CC"/><stop offset="1" stop-color="#0B8599"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- glyph: 288x288 keyline, 112 to 400 -->
  <!-- the option not taken -->
  <g opacity="0.55">
    <path d="M256 232A24 24 0 0 0 280 256H320A24 24 0 0 1 344 280V328" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="288" y="328" width="112" height="72" rx="24" fill="#FFFFFF"/>
  </g>
  <!-- the path taken: start node, down and left to the chosen option -->
  <path d="M256 184V232A24 24 0 0 1 232 256H192A24 24 0 0 0 168 280V328" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="112" width="112" height="72" rx="24" fill="#FFFFFF"/>
  <rect x="112" y="328" width="112" height="72" rx="24" fill="#FFFFFF"/>
</svg>
